name: Bug
description: Something behaves differently than expected
labels: [ bug ]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Never paste an API key.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from, or the release you installed.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, and whether you point it at statuspane.io or a local server.
    validations:
      required: false
